[package]
name = "clarisentry"
version = "0.1.0"
edition = "2021"
description = "A static analyzer for Clarity (Stacks) smart contracts — security linting for an under-tooled ecosystem"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
owo-colors = "4"
comfy-table = "7"
walkdir = "2"
